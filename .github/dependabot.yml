version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      express-ecosystem-majors:
        # express, express-ejs-layouts and helmet are the framework core —
        # bump these together deliberately (see docs/dev/phase-5 for the
        # planned Express 5 migration) rather than as three separate PRs.
        patterns:
          - "express"
          - "express-ejs-layouts"
          - "helmet"
        update-types:
          - "major"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Create source artifact
        run: |
          mkdir -p release
          tar --exclude=.git --exclude=node_modules --exclude=release -czf "release/kui-ejs-${GITHUB_REF_NAME#v}.tar.gz" .
      - name: Create checksums
        run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## KUI EJS ${{ github.ref_name }}

            KUI EJS is the Express/EJS implementation of the KUI design system.
            This release provides a portable source distribution suitable for
            deployment, internal mirrors, and reproducible application builds.

            ### Artifacts

            - `kui-ejs-<version>.tar.gz` with the application source
              and build configuration, excluding Git metadata, dependencies, and
              the release directory
            - `SHA256SUMS` for integrity verification

            Install dependencies with `npm ci`, then run `npm run build` and
            `npm start` in the extracted project.

            This release does not contain an executable installer, Debian package,
            RPM package, or native desktop binary.
          files: release/*

name: nightly

# $KUIREACT_ROOT/docs/dev/phase-2-testing.md 2.5 — the visual regression
# + axe suite is too slow (< 15 min budget, ~220 pages) to run on every
# PR, so it runs nightly here instead, plus on-demand from ci.yml for PRs
# labelled `visual`. See visual.yml for the actual job (shared between
# both triggers via workflow_call).

on:
  schedule:
    # 03:00 UTC daily — matches kui-react's nightly.yml cadence.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  visual:
    uses: ./.github/workflows/visual.yml
